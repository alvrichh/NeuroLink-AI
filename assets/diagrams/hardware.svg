<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="489" viewBox="0 0 1420 489" role="img" aria-label="Cadena electrónica EEG ADS1299 microcontrolador ordenador"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#93acc6"/></marker></defs><rect width="1420" height="489" rx="24" fill="#0a1220"/><text x="44" y="69" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="start">Arquitectura electrónica de adquisición EEG</text><text x="44" y="106" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#abc1d6" text-anchor="start">Bloques conceptuales: no es un esquemático certificado ni apto para contacto humano</text><rect x="30" y="156" width="206" height="159" rx="18" fill="#15283e" stroke="#3c688b" stroke-width="2"/><text x="133" y="217" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f8fafc" text-anchor="middle">ELECTRODOS</text><text x="133" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#bbcee1" text-anchor="middle">Registro físico</text><path d="M238 235 L258 235" stroke="#93acc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="263" y="156" width="206" height="159" rx="18" fill="#3a2e3a" stroke="#eea56b" stroke-width="2"/><text x="366" y="217" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f8fafc" text-anchor="middle">INTERFAZ</text><text x="366" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#bbcee1" text-anchor="middle">Protección*</text><path d="M471 235 L491 235" stroke="#93acc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="496" y="156" width="206" height="159" rx="18" fill="#15283e" stroke="#3c688b" stroke-width="2"/><text x="599" y="217" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f8fafc" text-anchor="middle">AFE + ADC</text><text x="599" y="261" font-