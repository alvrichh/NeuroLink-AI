<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="459" viewBox="0 0 1420 459" role="img" aria-label="De EEG a texto confirmado y respuesta de IA"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#93acc6"/></marker></defs><rect width="1420" height="459" rx="24" fill="#0a1220"/><text x="44" y="70" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#fff" text-anchor="start">Arquitectura — de la señal al diálogo</text><text x="44" y="109" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#a9bdd3" text-anchor="start">Diagrama de software, con confirmación explícita antes del envío</text><rect x="35" y="159" width="203" height="155" rx="18" fill="#162c46" stroke="#3f6386" stroke-width="2"/><text x="136" y="223" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#f8fafc" text-anchor="middle">EEG</text><text x="136" y="262" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#bcd0e5" text-anchor="middle">Captura / replay</text><path d="M240 236 L263 236" stroke="#93acc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="268" y="159" width="203" height="155" rx="18" fill="#162c46" stroke="#3f6386" stroke-width="2"/><text x="369" y="223" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#f8fafc" text-anchor="middle">MNE</text><text x="369" y="262" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#bcd0e5" text-anchor="middle">Procesamiento</text><path d="M473 236 L496 236" stroke="#93acc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="501" y="159" width="203" height="155" rx="18" fill="#162c46" stroke="#3f6386" stroke-width="2"/><text x="602" y="223" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#f8fafc" text-anchor="middle">P300</text><text x="602" y="262" font-family="Arial, sans-serif" font-size="18" font-weight