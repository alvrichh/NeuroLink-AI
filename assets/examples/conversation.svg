<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="598" viewBox="0 0 1380 598" role="img" aria-label="Conversación ilustrativa con IA"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#93acc6"/></marker></defs><rect width="1380" height="598" rx="24" fill="#0a1220"/><text x="48" y="70" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#fff" text-anchor="start">Ejemplo de conversación cerebro → IA</text><text x="48" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#a5bad0" text-anchor="start">La persona confirma el mensaje antes de enviarlo al asistente</text><rect x="62" y="157" width="1080" height="102" rx="18" fill="#142c45" stroke="#3b617e" stroke-width="2"/><text x="95" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#91bada" text-anchor="start">TEXTO SELECCIONADO (EJEMPLO)</text><text x="95" y="235" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f8fafc" text-anchor="start">HOLA IA</text><rect x="850" y="279" width="290" height="56" rx="18" fill="#11513b" stroke="#29c79f" stroke-width="2"/><text x="995" y="313" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">MENSAJE CONFIRMADO</text><rect x="233" y="365" width="1050" height="143" rx="18" fill="#193747" stroke="#396989" stroke-width="2"/><text x="265" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#88d6ec" text-anchor="start">RESPUESTA DE LA IA</text><text x="265" y="463" font-family="Arial, sans-serif" font-size="29" font-weight="500" fill="#fff" text-anchor="start">Hola, he recibido tu mensaje.</text><text x="63" y="561" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#e1ac7b" text-anchor="start">Maqueta · No se han usado señales EEG reales para generar el texto.</text></svg>