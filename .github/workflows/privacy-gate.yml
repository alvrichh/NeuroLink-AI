name: Privacy gate tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run behavior tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
