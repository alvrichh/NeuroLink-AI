name: IS-01 synthetic software tests
on:
  pull_request:
    paths: ['experiments/is01/**', '.github/workflows/is01.yml']
  push:
    branches: [main]
    paths: ['experiments/is01/**', '.github/workflows/is01.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/is01/requirements.txt
      - run: python -m pip install -r experiments/is01/requirements.txt
      - run: python -m pytest experiments/is01/tests -q
